services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sirea
      POSTGRES_PASSWORD: sirea
      POSTGRES_DB: sirea
    ports:
      - '5432:5432'
    volumes:
      - sirea_postgres_data:/var/lib/postgresql/data

volumes:
  sirea_postgres_data:
